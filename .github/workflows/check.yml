name: Check

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.react }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - react: React 19
            dependencies: ""
          - react: React 18.2
            dependencies: react@18.2.0 react-dom@18.2.0 @types/react@18.3.31 @types/react-dom@18.3.7
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install React matrix version
        if: matrix.dependencies != ''
        run: |
          pnpm add --save-dev --lockfile=false ${{ matrix.dependencies }}
          pnpm exec prettier --write pnpm-lock.yaml
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
